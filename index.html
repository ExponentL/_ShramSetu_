<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // Prevent Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var currentFetch = originalFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function () {
                  return currentFetch;
                },
                set: function (newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (e1) {
              try {
                var proto = Window.prototype;
                Object.defineProperty(proto, 'fetch', {
                  get: function () {
                    return currentFetch;
                  },
                  set: function (newFetch) {
                    currentFetch = newFetch;
                  },
                  configurable: true,
                  enumerable: true,
                });
              } catch (e2) {}
            }
          }
        } catch (err) {}

        // Global safety catcher for getter-only property assignments from injected scripts
        window.addEventListener(
          'error',
          function (e) {
            if (e && e.message && e.message.includes('Cannot set property fetch of')) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
